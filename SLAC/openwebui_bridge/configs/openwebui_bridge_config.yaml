defaults:
  answer_language: zh
  answer_style: standard
  require_grounding: true
  insufficient_evidence_policy: explicit_uncertainty

pipeline:
  use_retrieval: true
  use_reranker: true
  allow_retrieval_fallback: true
  retrieval_top_k: 40
  reranker_top_k: 15
  max_evidence_items: 6
  max_evidence_tokens: 1800
  llm:
    provider: openai_compatible
    model_name: deepseek-chat
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    generation_config:
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      timeout_s: 120

response_options:
  include_integration_response: false
  include_trace_summary: true
  include_debug_meta: false
