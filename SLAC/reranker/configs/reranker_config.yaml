common:
  model_name: "BAAI/bge-reranker-v2-m3"
  model_path: "/root/autodl-tmp/models/bge-reranker-v2-m3"
  device: "cuda"
  torch_dtype: "float16"
  batch_size: 8
  max_length: 1024
  normalize: true
  strict_schema: false

candidate_pool:
  direct_top_n: 30
  expanded_top_n: 20
  max_pairs_per_query: 50
  dedupe_key: "chunk_id"

ranking:
  output_top_n: 50

pack_bridge:
  enabled: true
  pack_top_n: 12
  reserve_direct_top_n: 0
  reserve_expanded_top_n: 0
  max_token_budget: null

debug:
  dump_scored_pairs: true
  save_summary: true
  fail_fast: true
  recursive_scan: false