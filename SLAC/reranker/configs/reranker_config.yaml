common:
  model_name: "BAAI/bge-reranker-v2-m3"
  model_path: "/root/autodl-tmp/models/bge-reranker-v2-m3"
  device: "cuda"
  torch_dtype: "float16"
  batch_size: 8
  max_length: 1024
  normalize: true

candidate_pool:
  direct_top_n: 30
  expanded_top_n: 20
  max_pairs_per_query: 50
  dedupe_key: "chunk_id"

ranking:
  sort_keys:
    - "rerank_score_norm:desc"
    - "retrieve_rank_fused:asc"
    - "chunk_id:asc"
  output_top_n: 50

io:
  filename_policy: "query_level"

debug:
  dump_scored_pairs: true
  dump_passage_text: false
  save_summary: true

run_reranker_infer_only: {}
run_reranker_pipeline: {}
run_build_reranker_trainset: {}
