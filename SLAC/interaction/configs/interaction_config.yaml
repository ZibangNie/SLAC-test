defaults:
  pipeline_config:
    use_retrieval: true
    use_reranker: true
    allow_retrieval_fallback: true

    retrieval_top_k: 40
    reranker_top_k: 15

    max_evidence_items: 6
    max_evidence_tokens: 1800

    prefer_direct_first: true
    min_direct_evidence: 1

    llm:
      provider: "openai_compatible"
      model_name: "deepseek-chat"
      api_base: "https://api.deepseek.com/v1"
      api_key_env: "DEEPSEEK_API_KEY"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      timeout_s: 120

  prompt_hints:
    answer_language: "zh"
    require_grounding: true
    answer_style: "concise"
    insufficient_evidence_policy: "state_insufficiency"

response_options:
  return_integration_response: true
  return_trace_summary: true
  return_display_messages: true